<!doctype html><html lang="es"><head><meta charset="utf-8"><title>social</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500&display=swap">
<style>
body{margin:0;background:#fff}
#card{position:relative;width:1200px;height:630px;overflow:hidden;background:linear-gradient(135deg,#eef3ff 0%,#fff 55%,#fff5c7 100%);font-family:Inter,system-ui,sans-serif}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6}
.b1{width:520px;height:520px;left:-160px;top:-200px;background:#4f86f7}.b2{width:420px;height:420px;right:-120px;top:120px;background:#fcd116}.b3{width:360px;height:360px;left:420px;bottom:-220px;background:#ff7a8a;opacity:.35}
.wm{position:absolute;left:80px;top:70px;width:420px}
h1{position:absolute;left:80px;top:190px;margin:0;font-family:"Plus Jakarta Sans";font-weight:800;font-size:92px;line-height:.95;letter-spacing:-.05em;color:#111318;max-width:620px}
p{position:absolute;left:84px;top:430px;margin:0;font-size:30px;color:#2c2e2a;max-width:640px;line-height:1.3}
.tag{position:absolute;left:84px;bottom:52px;padding:12px 20px;border-radius:999px;background:#fcd116;font-family:"Plus Jakarta Sans";font-weight:800;font-size:22px;color:#111318}
.globe{position:absolute;right:70px;top:95px;width:440px;height:440px;filter:drop-shadow(0 40px 60px rgba(10,47,158,.28))}
</style></head><body><div id="card">
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
<img class="wm" src="wordmark.svg" alt="">
<h1>Aprende hablando.</h1>
<p>Idiomas de oído, media hora al día. Tagalog para Tondo, Bisaya y más.</p>
<span class="tag">worldspeak.es</span>
<div class="globe" id="g"></div>
<script>fetch('globe.svg').then(r=>r.text()).then(t=>{document.getElementById('g').innerHTML=t})</script>
</div></body></html>
